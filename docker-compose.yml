services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learny
      POSTGRES_USER: learny
      POSTGRES_PASSWORD: learny
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learny -d learny"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - learny-postgres:/var/lib/postgresql/data

volumes:
  learny-postgres:
